name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (project.zip or repo root)
        run: |
          if [ -f project.zip ]; then
            unzip -q -o project.zip -d _p
            D=$(dirname "$(find _p -name settings.gradle.kts | head -1)")
            echo "PROJECT_DIR=$PWD/$D" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" SmartRecitationStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartRecitationStudio-apk
          path: SmartRecitationStudio.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Smart Recitation Studio v${{ github.run_number }}
          files: SmartRecitationStudio.apk
